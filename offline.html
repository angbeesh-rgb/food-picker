<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#F9A8D4"/>
<title>오프라인 - 오늘 뭐먹지?</title>
<link rel="icon" type="image/png" href="icon-192.png"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#FBCFE8 0%,#F9A8D4 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#7C2D5A}
.wrap{background:#fff;border-radius:24px;padding:40px 28px;text-align:center;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(124,45,90,0.15)}
.emoji{font-size:64px;margin-bottom:16px}
h1{font-size:22px;font-weight:800;margin-bottom:10px;color:#7C2D5A}
p{font-size:14px;color:#888;line-height:1.6;margin-bottom:18px}
.btn{background:linear-gradient(135deg,#F9A8D4,#EC4899);color:#fff;border:none;padding:14px 28px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:10px;box-shadow:0 4px 12px rgba(236,72,153,0.25)}
.btn:active{transform:scale(0.97)}
.hint{font-size:11px;color:#bbb;margin-top:16px}
.feat{background:#FDF2F8;padding:14px;border-radius:12px;text-align:left;margin-top:18px}
.feat h3{font-size:13px;color:#9D174D;margin-bottom:8px;font-weight:700}
.feat ul{list-style:none;font-size:12px;color:#7C2D5A;line-height:1.8}
.feat li::before{content:'✓ ';color:#10b981;font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
  <div class="emoji">🍱📶</div>
  <h1>오프라인 상태예요</h1>
  <p>인터넷 연결이 끊어졌어요.<br>네트워크를 확인하고 다시 시도해주세요.</p>
  
  <div class="feat">
    <h3>📱 오프라인에서도 가능해요</h3>
    <ul>
      <li>저장된 식단일기 보기</li>
      <li>등록한 집밥 레시피 조회</li>
      <li>기본 메뉴 추천 (날씨 제외)</li>
      <li>장보기 목록 관리</li>
    </ul>
  </div>
  
  <button class="btn" onclick="window.location.reload()">🔄 다시 연결 시도</button>
  <div class="hint">연결되면 인기 메뉴와 날씨 정보가 다시 작동해요</div>
</div>
<script>
// 온라인 복귀 감지 시 자동 새로고침
window.addEventListener('online', ()=>{
  setTimeout(()=>window.location.reload(), 500);
});
</script>
</body>
</html>
